name: commit-msg

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

jobs:
  commit-msg:
    name: commit-msg
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install commitizen
        run: pip install "commitizen>=4.19,<5"
      - name: Check commit messages
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -uo pipefail
          fail=0
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if ! cz check --message "$PR_TITLE"; then
              echo "::error::Заголовок PR не соответствует Conventional Commits"
              fail=1
            fi
          else
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
              range="$BEFORE..$AFTER"
            else
              range="$AFTER"
            fi
            for sha in $(git rev-list "$range"); do
              msg=$(git log -1 --format=%B "$sha")
              if ! cz check --message "$msg"; then
                echo "::error::Коммит $sha не соответствует Conventional Commits"
                fail=1
              fi
            done
          fi
          exit "$fail"
