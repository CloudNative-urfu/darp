schema: spec-driven

context: |
  DARP (Defense, Attack Research Platform) — исследовательский полигон для ИИ-агентов
  в кибербезопасности. Изолированная gym-подобная среда, атакующая сторона (Kali Linux),
  защитная сторона (open-source мониторинг: Wazuh/ELK), переключаемые LLM (локальные и
  облачные) с контролем токенов и хранилищ.
  Текущее исследовательское направление — оценка применимости существующих гвардрейлов
  в бизнес-процессе чатового агента: полигон с конфигурациями гвардрейлов, атакующая сторона
  взаимодействует с защищаемым агентом только через текстовый канал; сравнение по безопасности,
  полезности, непрерывности и стоимости, итоговый вывод — порог окупаемости (break-even).
  Гвардрейлы берутся готовые, open-source и self-hosted; собственные детекторы не разрабатываются.
  Стек: Python, LangChain/AutoGen, Docker, Gymnasium, Hugging Face, локальный запуск моделей.
  Полное описание направления — docs/guardrails-business-value.md.
  docs/description.md — исходная карточка проекта, сохранена как история.

  Инфраструктурные правила репозитория (обязательны для артефактов):
  - Каждый change привязан к GitHub issue в CloudNative-urfu/darp; имя change —
    "<номер-issue>-<slug>". Issue лежит на доске CloudNative-urfu/projects/1.
  - Спеки коммитятся напрямую в ветку develop; main — только через PR из develop.
  - Язык артефактов — русский, технические термины — английские.

rules:
  proposal:
    - Указывать ссылку на issue (#N) и её URL.
    - Явно описывать out of scope.
  specs:
    - Один сценарий на проверяемое поведение.
  tasks:
    - Каждая задача — чекбокс вида "- [ ] 1.1 ...".
    - Задачи атомарные и проверяемые.
  design:
    - Учитывать влияние на изоляцию полигона и на переключение LLM.

operations:
  apply:
    guidance:
      - Работать в ветке от develop, PR с "Closes #<issue>".
  archive:
    guidance:
      - Архивировать change после мержа реализации в develop.
